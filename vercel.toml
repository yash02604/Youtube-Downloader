"$schema" = "https://openapi.vercel.sh/vercel.json"

[services.frontend]
root = "web/frontend/"
framework = "nextjs"

# Keep the shared downloader modules importable from the repository root.
[services.backend]
root = "."
framework = "fastapi"
# Declared-only mode also anchors Python dependency discovery at this root.
# tool.vercel.entrypoint in pyproject.toml names the actual FastAPI application.
entrypoint = "pyproject.toml"

[services.backend.functions."web/backend/vercel_app.py"]
excludeFiles = "{web/frontend/**,tests/**,docs/**,packaging/**,smoke_test/**}"

[[rewrites]]
source = "/api"
destination = { service = "backend" }

[[rewrites]]
source = "/api/(.*)"
destination = { service = "backend" }

[[rewrites]]
source = "/(.*)"
destination = { service = "frontend" }
