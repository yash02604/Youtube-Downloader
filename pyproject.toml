[project]
name = "video-downloader-vercel-poc"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
# Vercel detects this manifest at the backend service root. Keep the shared
# runtime dependencies aligned with requirements.txt; desktop pip usage stays
# unchanged. web/backend/requirements.txt remains the local web install path.
dependencies = [
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "yt-dlp[default]>=2026.10.26",
    "psutil>=5.9.0",
    "Pillow>=10.0.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[tool.vercel]
entrypoint = "web.backend.vercel_app:app"
